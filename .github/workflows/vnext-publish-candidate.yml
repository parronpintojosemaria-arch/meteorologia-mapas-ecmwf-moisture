name: vNext · Candidato Pages · ECMWF moisture · 340 mapas

on:
  push:
    branches: [main]
    paths: ['.github/workflows/vnext-publish-candidate.yml']
  schedule:
    - cron: '45 3 * * *'
    - cron: '45 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ecmwf-moisture-candidate
  cancel-in-progress: false

jobs:
  build:
    name: Generar y validar ECMWF moisture HD
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      cycle: ${{ steps.cycle.outputs.cycle }}
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar backend vNext
        run: |
          set -euo pipefail
          git clone --depth 1 --branch vnext-mapas-profesional \
            https://github.com/parronpintojosemaria-arch/meteorologia-mapas-backend.git backend

      - name: Dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar generador moisture
        working-directory: backend
        run: |
          python -m py_compile scripts/vnext_moisture_generate.py
          python -m py_compile scripts/vnext_ecmwf_data.py
          python -m py_compile scripts/vnext_ecmwf_render.py
          python -m py_compile scripts/vnext_gfs_preflight.py
          python -m py_compile scripts/vnext_current_guard.py

      - id: cycle
        name: Sincronizar ciclo con ECMWF surface
        shell: bash
        run: |
          set -euo pipefail
          CYCLE=$(python -c "import json,urllib.request as u; d=json.load(u.urlopen('https://parronpintojosemaria-arch.github.io/meteorologia-mapas-ecmwf-surface/current.json',timeout=30)); assert d.get('status')=='ready',d; assert d.get('model')=='ecmwf-surface',d; assert int(d.get('file_count',0))==1472,d; c=d.get('cycle'); assert isinstance(c,str) and c,d; print(c)")
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "CYCLE=$CYCLE" >> "$GITHUB_ENV"
          echo "ECMWF moisture sincronizado con surface: $CYCLE"

      - name: Generar 340 mapas IVT + TCWV · España 2400 · Europa 2800
        working-directory: backend
        timeout-minutes: 330
        run: python scripts/vnext_moisture_generate.py ecmwf --cycle "$CYCLE"

      - name: Construir manifest y validar todos los archivos
        working-directory: backend
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image
          cycle=os.environ['CYCLE']
          root=Path('vnext-full-out/ecmwf/cycles')/cycle
          frag=root/'fragment-moisture.json'
          d=json.loads(frag.read_text(encoding='utf-8'))
          assert d['status']=='ready' and d['group']=='moisture'
          assert d['cycle']==cycle and d['expected_count']==340 and len(d['files'])==340
          assert set(x['product'] for x in d['files'])=={'ivt_1000_300','tcwv'}
          widths={'spain':2400,'europe':2800}; total=0
          for row in d['files']:
              p=root/row['path']
              assert p.is_file() and p.stat().st_size>100, p
              assert row['width']==widths[row['domain']] and row['height']>900, row
              total += p.stat().st_size
          for row in (d['files'][0],d['files'][len(d['files'])//2],d['files'][-1]):
              with Image.open(root/row['path']) as im: im.verify()
          mib=total/(1024*1024)
          assert mib < 940.0, f'ECMWF moisture supera guard Pages: {mib:.2f} MiB'
          manifest=dict(d); manifest['schema']='vnext-ecmwf-moisture-1'; manifest['publication_role']='ecmwf-moisture-shard'
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'ECMWF MOISTURE SHARD OK · 340 mapas · {mib:.2f} MiB · ciclo {cycle}')
          PY

      - name: Preparar sitio candidato
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "../site/cycles/$CYCLE"
          cp -a "vnext-full-out/ecmwf/cycles/$CYCLE/." "../site/cycles/$CYCLE/"
          python scripts/vnext_current_guard.py \
            --model ecmwf-moisture \
            --cycle "$CYCLE" \
            --cycle-dir "vnext-full-out/ecmwf/cycles/$CYCLE" \
            --base-url 'https://parronpintojosemaria-arch.github.io/meteorologia-mapas-ecmwf-moisture' \
            --output ../site/current.json
          cat > ../site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Meteorología Interactiva · ECMWF moisture</title>
          <h1>Meteorología Interactiva · ECMWF moisture</h1>
          <p>IVT 1000–300 hPa + TCWV. Datos oficiales ECMWF Open Data.</p>
          <p>IVT alto no se etiqueta automáticamente como río atmosférico: se requiere estructura, persistencia y contexto.</p>
          <p><a href="current.json">current.json</a></p>
          HTML
          touch ../site/.nojekyll

      - name: Guard final candidato
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('site/current.json').read_text())
          assert c['status']=='ready' and c['model']=='ecmwf-moisture' and c['file_count']==340
          assert Path('site/cycles',c['cycle'],'manifest.json').is_file()
          print('CURRENT CANDIDATO ECMWF MOISTURE OK',c['cycle'],c['file_count'])
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar candidato Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    name: Publicar candidato aislado ECMWF moisture
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar Pages
        id: deployment
        uses: actions/deploy-pages@v4
